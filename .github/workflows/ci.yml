name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # romty drives PTYs and unix sockets, whose limits differ between the two:
    # the socket path ceiling is 104 bytes on macOS and 108 on Linux, and the
    # shells print different prompts. Testing one would not cover the other.
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Check formatting
        run: |
          unformatted="$(gofmt -s -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt -s reports:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        # A session runs several goroutines around one emulator, so the race
        # detector is the check that matters most here.
        run: go test -race ./...

      - name: Build
        run: go build ./...

  release-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Build release snapshot
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.17.1
          args: release --snapshot --clean

      - name: Validate Homebrew formula
        run: |
          ./scripts/render-homebrew-formula.sh v0.0.0 dist/checksums.txt /tmp/romty.rb
          ruby -c /tmp/romty.rb
          for artifact in dist/romty_0.0.0_{darwin,linux}_{amd64,arm64}.tar.gz; do
            if ! tar -tzf "$artifact" | grep -qx romty; then
              echo "$artifact does not contain a top-level romty binary"
              exit 1
            fi
          done
