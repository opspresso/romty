name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # romty drives PTYs and unix sockets, whose limits differ between the two:
    # the socket path ceiling is 104 bytes on macOS and 108 on Linux, and the
    # shells print different prompts. Testing one would not cover the other.
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Check formatting
        run: |
          unformatted="$(gofmt -s -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt -s reports:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        # A session runs several goroutines around one emulator, so the race
        # detector is the check that matters most here.
        run: go test -race ./...

      - name: Build
        run: go build ./...
