version: 2

project_name: romty

release:
  # Formula rendering validates the checksums before the release becomes public.
  draft: true

snapshot:
  # CI feeds the snapshot artifacts to the same formula renderer used by a
  # release, so their version must be deterministic there.
  version_template: 0.0.0

builds:
  - id: romty
    main: ./cmd/romty
    binary: romty
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      # About reports the release it was built as; without the stamp it can
      # only name the commit.
      - -s -w -X github.com/opspresso/romty/internal/version.Value={{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: romty
    ids:
      - romty
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
